[package]
name = "filefinder"
version = "0.1.0"
edition = "2021"

[dependencies]
jwalk = "0.8"    # Parallel directory traversal (faster than walkdir)
ignore = "=0.4.16"
regex = "1"
glob = "=0.3.0"
clap = { version = "=4.5.0", features = ["derive"] }
anyhow = "1"
atty = "0.2"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
codegen-units = 1
